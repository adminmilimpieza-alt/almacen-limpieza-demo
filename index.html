<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caja + Stock — Almacén Limpieza (Demo)</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>🧹 Caja + Stock <small>demo almacén limpieza</small></h1>
  <nav>
    <button data-tab="caja" class="active">Caja</button>
    <button data-tab="stock">Stock</button>
    <button data-tab="ventas">Ventas</button>
  </nav>
</header>

<main>
  <!-- CAJA -->
  <section id="tab-caja" class="tab active">
    <div class="grid2">
      <div>
        <input id="buscar" placeholder="Buscar producto… (ej: lavandina)" autocomplete="off">
        <div id="catalogo" class="catalogo"></div>
      </div>
      <div class="ticket">
        <h2>Ticket actual</h2>
        <div id="carrito"></div>
        <div class="total">Total: $<span id="total">0</span></div>
        <div class="row">
          <select id="pago">
            <option value="efectivo">Efectivo</option>
            <option value="transferencia">Transferencia</option>
            <option value="cuenta">Cuenta corriente</option>
          </select>
          <button id="cobrar" class="primary">Cobrar</button>
          <button id="vaciar">Vaciar</button>
        </div>
        <p class="hint">Al cobrar se descuenta stock y se guarda la venta.</p>
      </div>
    </div>
  </section>

  <!-- STOCK -->
  <section id="tab-stock" class="tab">
    <div class="row">
      <button id="nuevo" class="primary">+ Nuevo producto</button>
      <button id="reset">Restablecer demo</button>
    </div>
    <table>
      <thead><tr><th>Producto</th><th>Categoría</th><th>Precio</th><th>Stock</th><th></th></tr></thead>
      <tbody id="tabla-stock"></tbody>
    </table>
    <p class="hint">Alerta: stock ≤ 5 se marca en rojo. Todo se guarda en el navegador (localStorage).</p>
  </section>

  <!-- VENTAS -->
  <section id="tab-ventas" class="tab">
    <h2>Historial de ventas</h2>
    <div id="ventas"></div>
  </section>
</main>

<!-- Modal producto -->
<dialog id="modal">
  <form method="dialog" id="form-prod">
    <h3 id="modal-titulo">Nuevo producto</h3>
    <input id="f-nombre" placeholder="Nombre (ej: Detergente x 5L)" required>
    <input id="f-cat" placeholder="Categoría (ej: Cocina / Baño / Piso)">
    <select id="f-icono">
      <option value="🧹">🧹 General</option>
      <option value="🧴">🧴 Bidón</option>
      <option value="🧽">🧽 Esponja</option>
      <option value="🧼">🧼 Jabón</option>
      <option value="🍽️">🍽️ Cocina</option>
      <option value="🧻">🧻 Baño</option>
      <option value="🪟">🪟 Vidrios</option>
      <option value="🗑️">🗑️ Bolsas</option>
      <option value="🧤">🧤 Accesorio</option>
      <option value="🏊">🏊 Pileta</option>
      <option value="👕">👕 Ropa</option>
    </select>
    <input id="f-precio" type="number" min="0" step="1" placeholder="Precio" required>
    <input id="f-stock" type="number" min="0" step="1" placeholder="Stock inicial" value="10">
    <div class="row">
      <button value="cancel">Cancelar</button>
      <button id="guardar-prod" value="default" class="primary">Guardar</button>
    </div>
  </form>
</dialog>

<script src="js/store.js"></script>
<script src="js/caja.js"></script>
<script src="js/stock.js"></script>
<script src="js/app.js"></script>
</body>
</html>
