<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi Limpieza · Nueva dirección</title><style>body{font:17px/1.6 system-ui,sans-serif;background:#f7f6f3;color:#20252b;margin:0;padding:8vh 24px}main{max-width:600px;margin:auto;background:white;padding:32px;border:1px solid #e5e5e5;border-radius:12px}h1{line-height:1.2}a{display:block;text-align:center;color:white;background:#22306b;padding:14px;border-radius:6px;text-decoration:none;font-weight:600}button{margin-top:20px;padding:10px;background:white;border:1px solid #ccc;border-radius:6px;cursor:pointer}small{display:block;margin-top:16px;color:#666}</style></head><body><main><h1>Mi Limpieza se trasladó</h1><p>La aplicación ahora funciona en una única dirección, con los datos guardados online para todos los equipos. Esta versión anterior ya no permite operar.</p><a href="https://milimpieza.adminmilimpieza.workers.dev/">Ingresar a Mi Limpieza online</a><small>Guardá la nueva dirección en favoritos. Usá la clave de operador para ingresar.</small><button id="respaldo" type="button">Descargar respaldo de este navegador</button><p id="estado" role="status"></p></main><script>document.getElementById('respaldo').onclick=()=>{try{const data=localStorage.getItem('almacen_mi_limpieza_v11')||localStorage.getItem('limpieza_demo_v10');if(!data){document.getElementById('estado').textContent='Este navegador no tiene datos de la versión anterior.';return;}JSON.parse(data);const url=URL.createObjectURL(new Blob([data],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='respaldo-piloto-milimpieza-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);document.getElementById('estado').textContent='Se descargó el respaldo. Los datos de este navegador se conservaron.';}catch{document.getElementById('estado').textContent='No se pudo descargar el respaldo. Conservá este navegador sin borrar sus datos.';}};</script></body></html>
